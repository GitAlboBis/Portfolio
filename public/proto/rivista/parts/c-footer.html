<!-- THE DAWN CLOSE of every page but Contact (spec 50 §1, §4): at a straight edge the night becomes morning, a white
     ground; "Write to me.", the address and its copy control; then the legal line, the engine's line and "Back to top".
     [data-dawn]: the stage turns the points that cross into this rectangle into cobalt ink (scene "dawn"); nothing pours
     or drips. The markup is the same bytes on every page of an edition (assemble.mjs asserts it). -->
<footer class="dawn" id="write" data-dawn data-stage="dawn" aria-labelledby="dawn-h">
  <div class="dawn-view" data-stage-anchor="dawn" aria-hidden="true"></div>
  <div class="dawn-in">
    <h2 id="dawn-h" class="t-d1 dawn-h" data-focus>{{t:band.h}}</h2>
    <p class="dawn-mail"><a href="mailto:albertotuveri@gmail.com">albertotuveri@gmail.com</a></p>
    <p class="dawn-act"><button class="q copy" type="button" data-nv-copy="albertotuveri@gmail.com" data-nv-copied="{{t:copy.done.msg}}" data-nv-failed="{{t:copy.fail.msg}}"><span data-copy-label>{{t:copy.label}}</span><span data-copy-done aria-hidden="true">{{t:copy.done}}</span><span data-copy-fail aria-hidden="true">{{t:copy.fail}}</span></button><span class="sr-only" role="status" data-nv-copy-status></span><a class="q" href="https://www.linkedin.com/in/albertotuveri" rel="noopener">LinkedIn</a><a class="q" href="https://github.com/GitAlboBis" rel="noopener">GitHub</a></p>
  </div>
  <div class="legal">
    <p class="t-label">© 2026 Alberto Tuveri</p>
    <p class="legal-line">{{t:dawn.engine}}</p>
    <a class="q" href="#top">{{t:foot.top}} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></a>
  </div>
</footer>
