  <!-- CONTACT, the dawn page (spec 50 §4): the whole page is the morning. "Write to me." at the scale of the name, one
       sentence, the address with its copy control, LinkedIn, GitHub. The stage draws the points as cobalt ink, fine
       threads settling round the line; no glass. COPY: "band.h", "ct.line". -->
  <section class="sc ct" id="contact" data-stage="contact" data-dawn aria-labelledby="ct-h">
    <div class="sc-view" data-stage-anchor="contact" aria-hidden="true"></div>
    <div class="sc-track">
      <div class="ct-in">
        <h1 id="ct-h" class="t-mega ct-h" data-focus="load">{{t:band.h}}</h1>
        <p class="t-lead ct-line" data-focus="load" style="--fd:140ms">{{t:ct.line}}</p>
        <p class="ct-mail" data-focus="load" style="--fd:220ms"><a href="mailto:albertotuveri@gmail.com">albertotuveri@gmail.com</a></p>
        <p class="ct-act" data-focus="load" style="--fd:300ms"><button class="q copy" type="button" data-nv-copy="albertotuveri@gmail.com" data-nv-copied="{{t:copy.done.msg}}" data-nv-failed="{{t:copy.fail.msg}}"><span data-copy-label>{{t:copy.label}}</span><span data-copy-done aria-hidden="true">{{t:copy.done}}</span><span data-copy-fail aria-hidden="true">{{t:copy.fail}}</span></button><span class="sr-only" role="status" data-nv-copy-status></span><a class="q" href="https://www.linkedin.com/in/albertotuveri" rel="noopener">LinkedIn</a><a class="q" href="https://github.com/GitAlboBis" rel="noopener">GitHub</a></p>
      </div>
    </div>
  </section>
